name = "interviewprep"
main = "src/worker/index.js"
compatibility_date = "2025-01-01"

[build]
# Cloudflare Workers Builds (the git-push CI integration) and `wrangler
# deploy`/`wrangler dev` all run this before anything else — this is the
# one place that's guaranteed to build dist/ regardless of how the
# Cloudflare dashboard's own build-command setting is configured (which
# this repo can't inspect or verify), unlike package.json's predeploy
# hook, which only fires for `npm run deploy` specifically.
command = "npm run build:web"

[assets]
# Built by `npm run build:web` (Vite — see vite.config.ts) from src/web/.
# index.html is the single document for the whole app — every route
# (/review, /settings, /login, /about, /privacy, etc.) is handled by
# React Router client-side, not a file of its own, so any unmatched path
# must fall back to index.html rather than 404.
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Without this, Cloudflare serves static files directly and never invokes
# fetch() below for them, so security headers (CSP, nosniff, etc.) would
# never get attached to index.html or other static responses.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "interview-prep-db"
database_id = "cf7f1830-9063-45d1-b403-3d67c330847a"

[vars]
# Public VAPID key for Web Push — safe to expose client-side, it's the
# public half of the key pair. The private half (VAPID_PRIVATE_KEY_JWK)
# is a secret, set via `wrangler secret put` (local dev: .dev.vars).
VAPID_PUBLIC_KEY = "BKRfk02EaqQBzr7XJVu1JKtfLqMV_soMk43cXTM-nj6E_I3a7mFwopTYzqE5EaNs4dluO3SwIuiN3HiwsH-98_c"

[triggers]
# Hourly: checks each push subscriber's local time (via their saved
# timezone) and sends at most one reminder per user per local day.
crons = ["0 * * * *"]

[ai]
binding = "AI"
# Workers AI has no local inference simulator. `remote = true` is meant to
# let this one binding hit the real Cloudflare AI service under plain
# `wrangler dev` while D1 stays local, but as of wrangler 4.135 the AI
# binding reports Mode "not supported" for that and calls just fail
# locally — generateMcq() in src/worker/lib/mcq.js falls back to a generic MCQ in
# that case, so local dev still works end-to-end, just without real AI
# output. To test the real provider calls, use `wrangler dev --remote`
# (touches the real D1 too) or test after `wrangler deploy`.
remote = true
